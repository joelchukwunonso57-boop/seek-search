
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEEK - Search Beyond Limits</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 16px;
  background: #f5f8ff;
  color: #17233c;
  font-family: Arial, sans-serif;
  text-align: center;
}

.logo {
  color: #1769e0;
  font-size: 48px;
  font-weight: bold;
  margin-top: 55px;
}

.tagline {
  color: #58677e;
  margin-bottom: 30px;
}

.search {
  max-width: 600px;
  margin: auto;
  display: flex;
  gap: 8px;
}

input {
  min-width: 0;
  flex: 1;
  padding: 16px;
  border: 1px solid #cbd5e1;
  border-radius: 30px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 25px;
  padding: 13px 18px;
  background: #1769e0;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

#results {
  max-width: 650px;
  margin: 30px auto;
  text-align: left;
}

.result {
  background: white;
  padding: 16px;
  margin: 12px 0;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

.result a {
  color: #1769e0;
  font-weight: bold;
  text-decoration: none;
}

.result p {
  color: #58677e;
  line-height: 1.5;
}

.categories {
  margin: 22px 0;
}

.categories button {
  margin: 4px;
  background: #e2ebfa;
  color: #1769e0;
}

#status {
  color: #58677e;
  margin-top: 20px;
}

footer {
  margin-top: 60px;
  color: #8290a5;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="logo">SEEK</div>
<p class="tagline">Search beyond limits.</p>

<form class="search" id="searchForm">
  <input id="searchInput"
    type="search"
    placeholder="Search SEEK..."
    required>
  <button type="submit">Search</button>
</form>

<div class="categories">
  <button type="button">Web</button>
  <button type="button" onclick="showMessage()">Images</button>
  <button type="button" onclick="showMessage()">News</button>
  <button type="button" onclick="showMessage()">Videos</button>
</div>

<p id="status">Loading SEEK search index...</p>
<div id="results"></div>

<footer>SEEK © 2026 — Search beyond limits.</footer>

<script>
let seekIndex = [];

async function loadIndex() {
  const status = document.getElementById("status");

  try {
    const response = await fetch("./seek_index.json");

    if (!response.ok) {
      throw new Error("Index file not found");
    }

    seekIndex = await response.json();
    status.textContent =
      "SEEK is ready! " + seekIndex.length +
      " webpages loaded.";

  } catch (error) {
    status.textContent =
      "SEEK could not load its search index. Please check the index file.";
  }
}

function searchSeek(query) {
  const results = document.getElementById("results");
  const status = document.getElementById("status");

  results.innerHTML = "";

  const words = query.toLowerCase().split(/\s+/);

  const matches = seekIndex.map(page => {
    const text = (page.title + " " + page.content).toLowerCase();

    let score = 0;
    words.forEach(word => {
      if (word && text.includes(word)) score++;
    });

    return { page, score };
  }).filter(item => item.score > 0)
    .sort((a, b) => b.score - a.score);

  if (matches.length === 0) {
    status.textContent = "No results found in SEEK's five saved webpages.";
    return;
  }

  status.textContent = matches.length + " results found in SEEK.";

  matches.forEach(item => {
    const card = document.createElement("div");
    card.className = "result";

    const link = document.createElement("a");
    link.href = item.page.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = item.page.title;

    const description = document.createElement("p");
    description.textContent =
      item.page.content.substring(0, 350) + "...";

    card.appendChild(link);
    card.appendChild(description);
    results.appendChild(card);
  });
}

document.getElementById("searchForm")
  .addEventListener("submit", function(event) {
    event.preventDefault();

    const query = document.getElementById("searchInput")
      .value.trim();

    if (query && seekIndex.length > 0) {
      searchSeek(query);
    }
  });

function showMessage() {
  document.getElementById("status").textContent =
    "This feature is still being developed.";
}

loadIndex();
</script>

</body>
</html>
