
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEEK - Search Beyond Limits</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 30px 16px;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #172033;
}
.container {
  max-width: 700px;
  margin: 50px auto;
  text-align: center;
}
h1 { font-size: 42px; margin-bottom: 8px; }
p { color: #596579; }
input {
  width: 100%;
  padding: 16px;
  border: 1px solid #ccd3df;
  border-radius: 10px;
  font-size: 16px;
  margin: 20px 0 10px;
}
button {
  padding: 14px 25px;
  border: 0;
  border-radius: 9px;
  background: #1746c7;
  color: white;
  font-size: 16px;
}
#status { margin: 18px 0; }
.result {
  background: white;
  padding: 16px;
  margin: 12px 0;
  border-radius: 10px;
  text-align: left;
}
.result a { color: #1746c7; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <h1>SEEK</h1>
  <p>Search Beyond Limits</p>

  <input id="searchBox" type="text" placeholder="What do you want to search for?">
  <button onclick="searchSEEK()">Search</button>

  <p id="status">Loading SEEK search index...</p>
  <div id="results"></div>
</div>

<script>
let seekIndex = [];

async function loadIndex() {
  const status = document.getElementById("status");

  try {
    const response = await fetch("./seek-data.json");

    if (!response.ok) {
      throw new Error("Index file not found");
    }

    seekIndex = await response.json();

    status.textContent =
      "SEEK is ready! " + seekIndex.length +
      " webpages loaded.";
  } catch (error) {
    status.textContent =
      "SEEK could not load its search index. Please check the index file.";
  }
}

function searchSEEK() {
  const query = document.getElementById("searchBox")
    .value.trim().toLowerCase();

  const results = document.getElementById("results");
  results.innerHTML = "";

  if (!query) {
    results.textContent = "Please enter something to search.";
    return;
  }

  const matches = seekIndex.filter(page =>
    (page.title + " " + page.content)
      .toLowerCase().includes(query)
  );

  if (matches.length === 0) {
    results.textContent = "No results found.";
    return;
  }

  matches.forEach(page => {
    const item = document.createElement("div");
    item.className = "result";

    const link = document.createElement("a");
    link.href = page.url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = page.title;

    const description = document.createElement("p");
    description.textContent = page.content;

    item.appendChild(link);
    item.appendChild(description);
    results.appendChild(item);
  });
}

loadIndex();
</script>
</body>
</html>
